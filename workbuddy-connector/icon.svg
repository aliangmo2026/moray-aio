<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c30"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5b7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- shield outline (glowing) -->
  <path filter="url(#glow)"
        d="M64 16 L102 30 V62 C102 88 86 104 64 112 C42 104 26 88 26 62 V30 Z"
        fill="none" stroke="url(#shield)" stroke-width="5"
        stroke-linejoin="round"/>

  <!-- terminal prompt inside shield -->
  <g stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="45,50 58,64 45,78"/>
    <line x1="66" y1="80" x2="85" y2="80"/>
  </g>
</svg>
